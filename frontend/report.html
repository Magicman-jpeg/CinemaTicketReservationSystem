<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Report</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <h1>Ticket Sales Report</h1>
    <h2>Tickets Sold per Movie</h2>
    <table id="ticketsTable"><thead><tr><th>Movie</th><th>Tickets Sold</th></tr></thead><tbody></tbody></table>

    <h2>Daily Revenue</h2>
    <table id="dailyTable"><thead><tr><th>Date</th><th>Revenue</th></tr></thead><tbody></tbody></table>

    <h2>Weekly Revenue</h2>
    <table id="weeklyTable"><thead><tr><th>Week</th><th>Revenue</th></tr></thead><tbody></tbody></table>

    <h2>Discount Usage</h2>
    <table id="discountTable"><thead><tr><th>Discount Type</th><th>Count</th><th>Total Discount</th></tr></thead><tbody></tbody></table>
  </div>
  <script src="js/report.js"></script>
</body>
</html>
